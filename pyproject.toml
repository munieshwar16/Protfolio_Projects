[project]
name = "mini-jira-bot"
version = "0.1.0"
description = "Async Mini-Jira chatbot with LangGraph + SQLite + Hugging Face LLM"
authors = [
  { name="Your Name", email="your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "aiosqlite>=0.19.0",
  "transformers>=4.40.0",
  "bitsandbytes>=0.43.0",
  "accelerate>=0.29.0",
  "torch>=2.1.0",
  "langgraph>=0.1.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "black>=24.3.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
